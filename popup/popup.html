<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CP-GitSync Settings</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      width: 330px;
      margin: 0;
      padding: 16px;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
    }
    .header-title {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #94a3b8;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 13px;
    }
    input:focus {
      outline: none;
      border-color: #2563eb;
    }
    .hint {
      font-size: 11px;
      color: #64748b;
      margin-top: 3px;
    }
    .save-btn {
      width: 100%;
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .save-btn:hover { background: #1d4ed8; }
    .status-msg {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      line-height: 1.4;
    }
    .status-msg.success { color: #34d399; }
    .status-msg.error { color: #f87171; }
  </style>
</head>
<body>
  <div class="header-title">⚡ CP-GitSync Settings</div>

  <div class="form-group">
    <label for="githubPat">GitHub Personal Access Token (PAT)</label>
    <input type="password" id="githubPat" placeholder="ghp_xxxxxxxxxxxx">
  </div>

  <div class="form-group">
    <label for="githubRepo">Repository Name (owner/repo)</label>
    <input type="text" id="githubRepo" placeholder="username/Competitive-Programming">
  </div>

  <div class="form-group">
    <label for="githubBranch">Branch</label>
    <input type="text" id="githubBranch" value="main">
  </div>

  <div class="form-group">
    <label for="gistId">Secret Gist ID (Optional)</label>
    <input type="text" id="gistId" placeholder="Auto-generated if left blank">
    <div class="hint">Stores problem stats across devices securely.</div>
  </div>

  <button id="saveConfigBtn" class="save-btn">Save & Authorize</button>
  <div id="statusMsg" class="status-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
